const details={"바보":["새로운 출발과 자유, 가능성을 뜻합니다. 아직 결과를 알 수 없지만 경험을 향해 움직이는 카드입니다.","새로운 경험에 열려 있음 · 가볍게 시작함","준비 부족 · 충동적 시작 · 방향이 불확실함","새로운 만남이나 관계의 시작 가능성. 아직 관계가 어디까지 갈지는 정해지지 않았습니다.","새 프로젝트나 새로운 길을 시작하는 흐름. 가능성은 있지만 준비 상태를 함께 봐야 합니다.","마법사 = 가진 능력과 자원을 활용해 실행 / 바보 = 무엇이 있을지 몰라도 일단 출발","새 출발 ≠ 성공 보장"],"마법사":["필요한 능력이나 자원을 활용해 실제 결과를 만들어내는 실행의 카드입니다.","능력 발휘 · 실행력 · 창조 · 주도성","능력 과신 · 말만 앞섬 · 자원을 제대로 쓰지 못함","호감을 실제 표현이나 행동으로 옮기는 힘이 있습니다.","아이디어를 현실로 만들 수 있는 자원과 실행력이 있는 상태입니다.","바보 = 일단 출발 / 마법사 = 가진 것을 써서 만들어냄","능력이 있다 ≠ 결과가 자동으로 나온다"],"여사제":["겉으로 드러난 정보보다 아직 보이지 않는 부분을 관찰하고 직관적으로 살피는 카드입니다.","직관 · 신중한 관찰 · 내면의 이해","숨김 · 소극성 · 지나친 침묵","감정이 전부 드러나지 않았을 수 있습니다. 서둘러 단정하기보다 관찰하는 흐름입니다.","정보가 충분히 드러나지 않은 상황. 판단 전에 더 살펴볼 필요가 있습니다.","은둔자 = 혼자 답을 찾음 / 여사제 = 드러나지 않은 것을 관찰","숨겨진 정보 ≠ 반드시 비밀·외도"],"여황제":["돌보고 키운 것이 풍성하게 성장하고 결실을 맺는 카드입니다.","성장 · 풍요 · 돌봄 · 결실","과잉보호 · 편안함에 안주 · 지나친 소비","애정과 돌봄이 풍부하고 관계가 성장하기 좋은 흐름입니다.","자원이나 성과가 자라나는 흐름. 꾸준히 키우는 힘이 중요합니다.","황제 = 구조와 관리 / 여황제 = 성장과 풍요","풍요로운 흐름 ≠ 아무 노력 없이 결과"],"황제":["규칙과 구조를 세우고 책임 있게 안정적으로 관리하는 힘입니다.","안정 · 책임 · 질서 · 통제력","경직됨 · 독단 · 지나친 통제","관계를 책임감 있게 안정시키려는 태도로 볼 수 있습니다.","기준과 체계를 세워 운영하는 힘. 관리와 책임이 강조됩니다.","소드 King = 무엇이 맞는지 판단 / 황제 = 어떻게 안정적으로 운영할지 관리","통제력 ≠ 상대를 마음대로 통제"],"교황":["검증된 규칙, 전통, 교육, 제도와 같은 기존의 체계를 따르는 카드입니다.","정석 · 조언 · 교육 · 제도권","고정관념 · 형식주의 · 남의 기준에 의존","공식적인 관계나 전통적인 가치, 약속을 중요하게 볼 수 있습니다.","검증된 방법이나 전문가의 조언, 기존 시스템을 활용하는 흐름입니다.","황제 = 내가 구조를 세움 / 교황 = 기존 구조와 정석을 따름","전통적 관계 ≠ 무조건 결혼"],"연인":["강한 끌림뿐 아니라 서로의 가치가 맞는지 보고 관계나 선택을 결정하는 카드입니다.","사랑 · 연결 · 가치 일치 · 선택","유혹 · 선택의 어려움 · 가치 충돌","호감과 연결이 강합니다. 동시에 관계에서 중요한 선택이 포함될 수 있습니다.","좋아 보이는 선택지 중 내 가치와 맞는 방향을 고르는 문제로 읽을 수 있습니다.","컵2 = 서로 통함 / 연인 = 끌림과 가치에 따른 선택","연인 카드 ≠ 무조건 결혼"],"전차":["목표를 정하고 의지와 통제력으로 앞으로 밀고 나가는 카드입니다.","목표 · 전진 · 승부욕 · 통제","무리한 추진 · 방향 상실 · 조급함","관계를 원하는 방향으로 적극적으로 끌고 가려는 움직임입니다.","명확한 목표를 세우고 성과를 향해 추진하는 힘이 강합니다.","소드 Knight = 판단 후 빠르게 행동 / 전차 = 목표를 정하고 전진","빠른 전진 ≠ 방향이 항상 옳다"],"힘":["감정을 억누르는 것이 아니라 인내와 자기조절로 내면의 힘을 사용하는 카드입니다.","인내 · 자기통제 의 충돌","의견이 다름 ≠ 헤어져야 함"],"완드 Six":["경쟁이나 노력 뒤에 승리와 인정을 받는 카드입니다.","승리·인정·성과","자만·외부 인정 의존","관계에서 인정받거나 자신감이 높아지는 흐름.","성과가 드러나고 주변의 인정을 받는 흐름.","세계 = 과정의 완성 / 완드6 = 경쟁·노력에서 인정받음","인정받음 ≠ 장기적 성공 보장"],"완드 Seven":["압박이나 경쟁 속에서도 자신의 자리와 입장을 지키는 카드입니다.","방어·버팀·경계 설정","과도한 방어·피로","관계에서 내 기준이나 경계를 지키려는 흐름.","경쟁 속에서 현재 위치를 방어해야 하는 상황.","완드9 = 지친 상태에서도 경계 / 완드7 = 압박 속에서 자리를 방어","방어한다 ≠ 관계나 일을 끝낸다"],"완드 Eight":["멈춰 있던 일이 갑자기 빠르게 움직이고 소식이나 연락이 오가는 카드입니다.","빠른 진행·소식·연락","성급함·통제 어려운 속도","연락이나 만남 등 관계의 움직임이 빨라질 수 있습니다.","업무나 프로젝트가 빠르게 진행되는 흐름.","전차 = 목표를 향한 의지적 전진 / 완드8 = 상황 자체의 빠른 움직임","연락이 온다 ≠ 재회한다"],"완드 Nine":["이미 지쳤지만 마지막까지 경계하며 버티는 카드입니다.","인내·경계·마지막 버팀","피로·불신·과도한 경계","상처나 피로 때문에 마음의 벽을 세울 수 있습니다.","지친 상태에서도 현재 위치를 지키는 흐름.","완드7 = 압박에 맞서 방어 / 완드9 = 이미 지친 채 경계","버틴다 ≠ 계속 버티는 게 최선"],"완드 Ten":["책임과 일이 너무 많이 쌓여 혼자 감당하기 벅찬 상태입니다.","책임·부담·과부하","번아웃·과도한 짐","관계를 혼자 책임지는 것처럼 느낄 수 있습니다.","업무와 책임이 과도하게 몰린 상태.","완드9 = 지쳤지만 버팀 / 완드10 = 짐 자체가 너무 많음","책임감 있음 ≠ 모든 일을 혼자 해야 함"],"완드 Page":["새로운 것에 호기심을 느끼고 해보고 싶어 하는 초기 열정과 소식의 카드입니다.","호기심·새 열정·소식","미숙함·변덕","새로운 호감이나 가벼운 설렘, 연락의 시작.","새 아이디어나 분야를 탐색하는 초기 단계.","완드 Ace = 열정의 불씨 / Page = 그 불씨를 궁금해하고 탐색","호기심 ≠ 장기적 의지"],"완드 Knight":["생각보다 행동이 먼저 나갈 정도로 열정적으로 돌진하는 카드입니다.","행동·돌진·열정","충동·지속성 부족","강한 끌림으로 적극적으로 접근할 수 있습니다.","기회를 보면 빠르게 행동하는 추진력.","소드 Knight = 판단 후 직진 / 완드 Knight = 열정으로 돌진","빠른 행동 ≠ 오래 지속됨"],"완드 Queen":["자신의 매력과 욕구를 알고 당당하게 주도하는 카드입니다.","자신감·매력·주도성","자기중심성·질투","자신감 있게 관계를 이끌거나 매력을 드러냅니다.","내 강점과 방향을 알고 주도적으로 움직입니다.","컵 Queen = 감정 공감 / 완드 Queen = 자신감과 주도성","자신감 ≠ 상대를 지배"],"완드 King":["큰 방향과 비전을 잡고 사람과 일을 이끄는 리더십의 카드입니다.","비전·리더십·통솔","독선·과도한 자신감","관계의 방향을 적극적으로 이끌려는 태도.","큰 그림을 보고 사업이나 팀의 방향을 잡는 힘.","소드 King = 기준을 세워 판단 / 완드 King = 비전을 세워 이끎","리더십 ≠ 혼자 결정"],"컵 Ace":["새로운 감정이 생기고 마음이 열리는 시작의 카드입니다.","감정의 시작·호감·마음 열림","감정 과잉·일방적 기대","새로운 호감이나 사랑의 감정이 시작될 수 있습니다.","일 자체에 애정이나 만족감을 느끼는 새로운 계기.","컵2 = 서로의 마음이 연결 / 컵 Ace = 내 마음이 먼저 생김","마음이 생김 ≠ 서로 사귄다"],"컵 Two":["두 사람의 감정이 서로 오가며 연결되는 카드입니다.","상호 호감·교감·파트너십","의존·관계 불균형","서로 마음이 통하고 호감을 주고받 "소드 Ace":["문제를 명확히 보고 판단·결단하는 힘이다","이성적으로 헤어져야 한다","상대와 관계를 끝내라는 뜻이다","무조건 빠르게 행동해야 한다"],
"절제":["서로 다른 부분을 조율하며 균형을 찾아가는 흐름이다","계속 만나면 반드시 잘된다","상대에게 맞춰주면 된다","결혼으로 이어진다"],
"컵 Queen":["감정을 이해하고 공감·배려하는 태도다","상대에게 무조건 맞춰줘야 한다","내 감정을 참아야 한다","관계를 유지해야 한다"]
};
let enabled=new Set(["메이저","완드","컵","소드"]), mode="meaning", current=null, answered=false;
let stat={"right":0,"total":0,"miss":{}};
try{const saved=localStorage.getItem("tarotStat");if(saved)stat=JSON.parse(saved);}catch(e){}
function save(){try{localStorage.setItem("tarotStat",JSON.stringify(stat));}catch(e){} drawScore()}
function drawScore(){let p=stat.total?Math.round(stat.right/stat.total*100):0;document.getElementById("score").textContent=`${stat.right}/${stat.total} · ${p}%`}
const f=document.getElementById("filters");
["메이저","완드","컵","소드"].forEach(s=>{let b=document.createElement("button");b.className="chip on";b.textContent=s;b.onclick=()=>{if(enabled.has(s)&&enabled.size>1){enabled.delete(s);b.classList.remove("on")}else{enabled.add(s);b.classList.add("on")} nextQ()};f.appendChild(b)});
document.getElementById("meaning").onclick=()=>setMode("meaning"); document.getElementById("overread").onclick=()=>setMode("overread");
function setMode(m){mode=m;document.getElementById("meaning").classList.toggle("on",m==="meaning");document.getElementById("overread").classList.toggle("on",m==="overread");nextQ()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function weightedPool(){let p=cards.filter(c=>enabled.has(c.suit));let out=[];p.forEach(c=>{let w=1+Math.min(4,stat.miss[c.ko]||0);for(let i=0;i<w;i++)out.push(c)});return out}
function pick(){if(mode==="overread"){let ks=Object.keys(overread).filter(k=>cards.find(c=>c.ko===k && enabled.has(c.suit))); if(ks.length){let k=ks[Math.floor(Math.random()*ks.length)];return cards.find(c=>c.ko===k)}}let p=weightedPool();return p[Math.floor(Math.random()*p.length)]}
function distractors(c){let same=cards.filter(x=>x.ko!==c.ko && enabled.has(x.suit));let preferred=same.filter(x=>x.suit===c.suit);let bag=shuffle([...preferred,...same]);let seen=new Set(), out=[];for(let x of bag){if(!seen.has(x.keywords)){seen.add(x.keywords);out.push(x.keywords)}if(out.length===3)break}return out}
function nextQ(){
 answered=false;current=pick();let fb=document.getElementById("feedback");fb.classList.remove("show");
 let img=document.getElementById("img"), fail=document.getElementById("imgfail");img.style.display="inline";fail.style.display="none";img.src=current.img;img.onerror=()=>{img.style.display="none";fail.style.display="block"};
 let correct, opts;
 if(mode==="overread" && overread[current.ko]){document.getElementById("qhead").textContent="이 카드의 해석으로 가장 적절한 것은?";let a=overread[current.ko];correct=a[0];opts=shuffle(a)}
 else{document.getElementById("qhead").textContent="이 카드의 핵심 의미는?";correct=current.keywords;opts=shuffle([correct,...distractors(current)])}
 current.correct=correct;
 let box=document.getElementById("choices");box.innerHTML="";
 opts.forEach((o,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<b>${i+1}.</b> ${o}`;b.onclick=()=>answer(b,o);box.appendChild(b)})
}
function answer(btn,val){
 if(answered)return;answered=true;stat.total++;let ok=val===current.correct;if(ok)stat.right++;else stat.miss[current.ko]=(stat.miss[current.ko]||0)+1;
 [...document.querySelectorAll(".choice")].forEach(b=>{b.disabled=true;if(b.textContent.includes(current.correct))b.classList.add("correct")});if(!ok)btn.classList.add("wrong");
 let r=document.getElementById("result");r.textContent=ok?"✅ 정답":"❌ 다시 기억";r.className="result "+(ok?"ok":"bad");
 document.getElementById("cardname").textContent=current.ko;
 document.getElementById("explain").textContent="핵심: "+current.keywords;
 document.getElementById("hook").textContent='한 줄 암기: “'+current.hook+'”';
 let d=details[current.ko];
 document.getElementById("detail").innerHTML=
   '<div class="detailsec"><b>📖 상세 설명</b>'+d[0]+'</div>'+
   '<div class="detailsec"><b>☀️ 긍정적으로 나오면</b>'+d[1]+'</div>'+
   '<div class="detailsec"><b>🌑 부정적으로 나오면</b>'+d[2]+'</div>'+
   '<div class="detailsec"><b>❤️ 연애</b>'+d[3]+'</div>'+
   '<div class="detailsec"><b>💼 일·사업</b>'+d[4]+'</div>'+
   '<div class="detailsec"><b>🔄 헷갈리는 카드</b>'+d[5]+'</div>'+
   '<div class="detailsec warn"><b>⚠️ 과해석 주의</b>'+d[6]+'</div>';
 document.getElementById("feedback").classList.add("show");save();
}
document.getElementById("next").onclick=nextQ; drawScore(); nextQ();
</script></body></html>
