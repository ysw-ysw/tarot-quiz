<style>
*{box-sizing:border-box} :root{--bg:#101116;--card:#1a1c24;--line:#343743;--txt:#f7f4ed;--muted:#a8abb5;--gold:#e7c675;--ok:#a9e6b1;--bad:#ffaaa5}

.choice{width:100%;text-align:left;border:1px solid var(--line);background:#14161c;color:var(--txt);border-radius:14px;padding:13px 14px;font-size:14px;line-height:1.42}

.next{width:100%;border:0;background:var(--gold);color:#17130b;border-radius:14px;padding:14px;font-weight:900;font-size:16px;margin-top:12px}
.small{font-size:11px;color:var(--muted);text-align:center;margin:12px 4px 4px;line-height:1.45}

const overread={
"컵 Six":["과거의 좋은 기억이나 옛 인연을 떠올린다","상대가 반드시 재회를 원한다","다시 만나면 관계가 좋아진다","상대가 먼저 연락한다"],
"컵 Eight":["남아 있는 감정이나 것이 있어도 떠나는 흐름이다","감정이 완전히 사라져서 떠난다","반드시 이별해야 한다","곧 새로운 연애를 시작한다"],
"컵 Nine":["현재 자신의 상태에 만족하는 흐름이다","이별한 것에 만족하고 있다","새로운 연인이 생겨 행복하다","상대와 재회하면 행복해진다"],
"소드 Three":["상처·슬픔·마음의 고통을 나타낸다","상대가 바람을 피우고 있다","삼각관계가 확정됐다","곧 이별한다"],
"소드 Seven":["정면으로 다루지 않거나 회피·숨김이 나타날 수 있다","상대가 외도하고 있다","문제를 전략적으로 해결한다","거짓말이 반드시 밝혀진다"],
"완드 Eight":["빠른 진행·소식·연락 같은 움직임이 있다","상대가 먼저 연락해 재회한다","연락하면 반드시 관계가 좋아진다","결혼이 빠르게 성사된다"],
"소드 Four":["생각이나 행동이 잠시 멈추고 거리를 두는 흐름이다","관계가 끝난다","지금 당장 헤어져야 한다","상대가 마음을 완전히 접었다"],
"소드 Ace":["문제를 명확히 보고 판단·결단하는 힘이다","이성적으로 헤어져야 한다","상대와 관계를 끝내라는 뜻이다","무조건 빠르게 행동해야 한다"],
"절제":["서로 다른 부분을 조율하며 균형을 찾아가는 흐름이다","계속 만나면 반드시 잘된다","상대에게 맞춰주면 된다","결혼으로 이어진다"],
"컵 Queen":["감정을 이해하고 공감·배려하는 태도다","상대에게 무조건 맞춰줘야 한다","내 감정을 참아야 한다","관계를 유지해야 한다"]
};
let enabled=new Set(["메이저","완드","컵","소드"]), mode="meaning", current=null, answered=false;
let stat={"right":0,"total":0,"miss":{}};
try{const saved=localStorage.getItem("tarotStat");if(saved)stat=JSON.parse(saved);}catch(e){}
function save(){try{localStorage.setItem("tarotStat",JSON.stringify(stat));}catch(e){} drawScore()}
function drawScore(){let p=stat.total?Math.round(stat.right/stat.total*100):0;document.getElementById("score").textContent=`${stat.right}/${stat.total} · ${p}%`}
const f=document.getElementById("filters");
["메이저","완드","컵","소드"].forEach(s=>{let b=document.createElement("button");b.className="chip on";b.textContent=s;b.onclick=()=>{if(enabled.has(s)&&enabled.size>1){enabled.delete(s);b.classList.remove("on")}else{enabled.add(s);b.classList.add("on")} nextQ()};f.appendChild(b)});
document.getElementById("meaning").onclick=()=>setMode("meaning"); document.getElementById("overread").onclick=()=>setMode("overread");
function setMode(m){mode=m;document.getElementById("meaning").classList.toggle("on",m==="meaning");document.getElementById("overread").classList.toggle("on",m==="overread");nextQ()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function weightedPool(){let p=cards.filter(c=>enabled.has(c.suit));let out=[];p.forEach(c=>{let w=1+Math.min(4,stat.miss[c.ko]||0);for(let i=0;i<w;i++)out.push(c)});return out}
function pick(){if(mode==="overread"){let ks=Object.keys(overread).filter(k=>cards.find(c=>c.ko===k && enabled.has(c.suit))); if(ks.length){let k=ks[Math.floor(Math.random()*ks.length)];return cards.find(c=>c.ko===k)}}let p=weightedPool();return p[Math.floor(Math.random()*p.length)]}
function distractors(c){let same=cards.filter(x=>x.ko!==c.ko && enabled.has(x.suit));let preferred=same.filter(x=>x.suit===c.suit);let bag=shuffle([...preferred,...same]);let seen=new Set(), out=[];for(let x of bag){if(!seen.has(x.keywords)){seen.add(x.keywords);out.push(x.keywords)}if(out.length===3)break}return out}
function nextQ(){
 answered=false;current=pick();let fb=document.getElementById("feedback");fb.classList.remove("show");
 let img=document.getElementById("img"), fail=document.getElementById("imgfail");img.style.display="inline";fail.style.display="none";img.src=current.img;img.onerror=()=>{img.style.display="none";fail.style.display="block"};
 let correct, opts;
 if(mode==="overread" && overread[current.ko]){document.getElementById("qhead").textContent="이 카드의 해석으로 가장 적절한 것은?";let a=overread[current.ko];correct=a[0];opts=shuffle(a)}
 else{document.getElementById("qhead").textContent="이 카드의 핵심 의미는?";correct=current.keywords;opts=shuffle([correct,...distractors(current)])}
 current.correct=correct;
 let box=document.getElementById("choices");box.innerHTML="";
 opts.forEach((o,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<b>${i+1}.</b> ${o}`;b.onclick=()=>answer(b,o);box.appendChild(b)})
}
function answer(btn,val){
 if(answered)return;answered=true;stat.total++;let ok=val===current.correct;if(ok)stat.right++;else stat.miss[current.ko]=(stat.miss[current.ko]||0)+1;
 [...document.querySelectorAll(".choice")].forEach(b=>{b.disabled=true;if(b.textContent.includes(current.correct))b.classList.add("correct")});if(!ok)btn.classList.add("wrong");
 let r=document.getElementById("result");r.textContent=ok?"✅ 정답":"❌ 다시 기억";r.className="result "+(ok?"ok":"bad");
 document.getElementById("cardname").textContent=current.ko;
 document.getElementById("explain").textContent="핵심: "+current.keywords;
 document.getElementById("hook").textContent='한 줄 암기: “'+current.hook+'”';
 document.getElementById("feedback").classList.add("show");save();
}
document.getElementById("next").onclick=nextQ; drawScore(); nextQ();
</script></body></html>
